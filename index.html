    <script>
        // ⚠️ បញ្ចូល Link Google Script របស់អ្នកនៅទីនេះ ⚠️
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyj_q0htRc4dLfNRCsDOWinLhI0PV1ijYnXefLJupB3U6s4Kye4BShSSyBvxUv6VzpV/exec'; 

        const form = document.getElementById('attendanceForm');
        const manualLoginForm = document.getElementById('manualLoginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loadingIcon = document.getElementById('loadingIcon');
        const alertMsg = document.getElementById('alertMsg');
        const timeStatus = document.getElementById('timeStatus');
        
        let CURRENT_USER_EMAIL = ""; 
        let IS_SYSTEM_OPEN = false;

        // មុខងារថ្មីសម្រាប់ទាញយកស្ថានភាពពី Google Sheets
        async function checkSystemStatus() {
            timeStatus.innerHTML = `កំពុងឆែកមើល... ⏳`;
            timeStatus.className = "mt-2 text-xs font-bold px-3 py-1.5 inline-block rounded-full bg-blue-100 text-blue-600 border border-blue-200 cursor-pointer animate-pulse";
            
            try {
                // បន្ថែម ?action=getStatus ទៅលើ URL
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getStatus`);
                const data = await response.json();

                if (data.status === "OPEN") {
                    IS_SYSTEM_OPEN = true;
                    timeStatus.innerHTML = `🟢 ប្រព័ន្ធបើកដំណើរការ (ចុចដើម្បី Refresh)`;
                    timeStatus.className = "mt-2 text-xs font-bold px-3 py-1.5 inline-block rounded-full bg-green-100 text-green-600 border border-green-200 cursor-pointer shadow-sm";
                    
                    // បើកប៊ូតុងបញ្ជូន
                    submitBtn.disabled = false;
                    submitBtn.className = "w-full mt-8 bg-gradient-to-r from-primary to-pink-400 hover:from-primaryHover hover:to-primary text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-pink-500/30 transition-all duration-300 transform hover:-translate-y-0.5 flex justify-center items-center group";
                    btnText.innerHTML = `បញ្ជូនទិន្នន័យ <svg class="w-5 h-5 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
                    
                } else {
                    IS_SYSTEM_OPEN = false;
                    timeStatus.innerHTML = `🔴 ប្រព័ន្ធបិទ (រង់ចាំគ្រូបើកសិន រួចចុច Refresh)`;
                    timeStatus.className = "mt-2 text-xs font-bold px-3 py-1.5 inline-block rounded-full bg-red-100 text-red-600 border border-red-200 cursor-pointer shadow-sm";
                    
                    // បិទប៊ូតុងបញ្ជូន
                    submitBtn.disabled = true;
                    submitBtn.className = "w-full mt-8 bg-gradient-to-r from-gray-400 to-gray-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all duration-300 flex justify-center items-center opacity-50 cursor-not-allowed";
                    btnText.innerHTML = 'ហាមបញ្ជូន (ប្រព័ន្ធបិទ)';
                }
            } catch (error) {
                console.error("Error fetching status:", error);
                timeStatus.innerHTML = `⚠️ មានបញ្ហាអ៊ីនធឺណិត (ចុចសាកល្បងម្ដងទៀត)`;
                timeStatus.className = "mt-2 text-xs font-bold px-3 py-1.5 inline-block rounded-full bg-yellow-100 text-yellow-600 border border-yellow-200 cursor-pointer";
            }
        }

        // ការគ្រប់គ្រង Login ដោយដៃ
        manualLoginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('manualEmail').value;
            
            if(emailInput) {
                CURRENT_USER_EMAIL = emailInput;
                document.getElementById('userEmailDisplay').innerText = emailInput;
                document.getElementById('userAvatar').src = "https://cdn-icons-png.flaticon.com/512/3177/3177440.png"; 

                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('mainAttendanceCard').classList.remove('hidden');
                
                localStorage.setItem("userEmail", emailInput);
                localStorage.setItem("userPicture", "https://cdn-icons-png.flaticon.com/512/3177/3177440.png");
                
                checkSystemStatus(); // ឆែកស្ថានភាពប្រព័ន្ធពេល Login ចូលភ្លាម
            }
        });

        // គ្រប់គ្រង Google Login
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            CURRENT_USER_EMAIL = responsePayload.email;
            
            document.getElementById('userEmailDisplay').innerText = responsePayload.email;
            document.getElementById('userAvatar').src = responsePayload.picture;

            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('mainAttendanceCard').classList.remove('hidden');
            
            localStorage.setItem("userEmail", responsePayload.email);
            localStorage.setItem("userPicture", responsePayload.picture);
            
            checkSystemStatus(); // ឆែកស្ថានភាពប្រព័ន្ធពេល Login ចូលភ្លាម
        }

        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function logout() {
            localStorage.clear();
            location.reload(); 
        }

        window.addEventListener('load', function() {
            const welcomeSplash = document.getElementById('welcomeSplash');
            
            const savedEmail = localStorage.getItem("userEmail");
            const savedPicture = localStorage.getItem("userPicture");
            
            if (savedEmail && savedPicture) {
                CURRENT_USER_EMAIL = savedEmail;
                document.getElementById('userEmailDisplay').innerText = savedEmail;
                document.getElementById('userAvatar').src = savedPicture;
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('mainAttendanceCard').classList.remove('hidden');
                
                checkSystemStatus(); // ឆែកស្ថានភាពប្រព័ន្ធបើធ្លាប់ Login រួច
            }
            
            setTimeout(() => {
                welcomeSplash.classList.add('opacity-0', 'pointer-events-none');
                document.body.classList.remove('loading-active'); 
                setTimeout(() => { welcomeSplash.remove(); }, 700);
            }, 1200);
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault(); 

            // ឆែកមើលម្ដងទៀតមុនពេលបញ្ជូន ក្រែងលោគ្រូបិទបាត់ហើយ
            if (!IS_SYSTEM_OPEN) {
                showAlert('❌ បរាជ័យ៖ គ្រូបានបិទប្រព័ន្ធវត្តមានហើយ!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed', 'scale-[0.98]');
            btnText.innerHTML = 'កំពុងបញ្ជូន...';
            loadingIcon.classList.remove('hidden');
            alertMsg.classList.add('hidden');

            const formData = new FormData(form);
            formData.append('email', CURRENT_USER_EMAIL);
            
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    showAlert('✅ បញ្ជូនទិន្នន័យជោគជ័យ!', 'success');
                    document.getElementById('studentName').selectedIndex = 0;
                    const checkedRadio = document.querySelector('input[name="status"]:checked');
                    if (checkedRadio) checkedRadio.checked = false;
                } else {
                    showAlert('❌ បរាជ័យក្នុងការបញ្ជូនទៅកាន់ Sheets!', 'error');
                }
            })
            .catch(error => {
                showAlert('⚠️ មានបញ្ហាភ្ជាប់បណ្តាញ! សូមព្យាយាមម្តងទៀត។', 'error');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed', 'scale-[0.98]');
                btnText.innerHTML = `បញ្ជូនទិន្នន័យ <svg class="w-5 h-5 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
                loadingIcon.classList.add('hidden');
            });
        });

        function showAlert(text, type) {
            alertMsg.innerHTML = text;
            alertMsg.className = 'mt-5 p-3.5 rounded-xl text-sm text-center font-bold shadow-sm transition-all duration-300 animate-bounce block';
            if (type === 'success') {
                alertMsg.classList.add('bg-pink-100', 'text-pink-600', 'border', 'border-pink-200');
                alertMsg.classList.remove('bg-red-50', 'text-red-500', 'border-red-100');
            } else {
                alertMsg.classList.add('bg-red-50', 'text-red-500', 'border', 'border-red-100');
                alertMsg.classList.remove('bg-pink-100', 'text-pink-600', 'border-pink-200');
            }
        }
    </script>
</body>
</html>
